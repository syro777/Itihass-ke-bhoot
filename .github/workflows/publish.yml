name: Render & publish episode

# The daily routine commits an episode (script, timeline, scenes, public/<id>/mix.m4a,
# upload.json, youtube.md) and writes its id to episodes/LATEST (one id per line for a batch).
# This workflow renders each listed episode in parallel,
# attaches the MP4 to a GitHub Release, and uploads to YouTube when AUTO_UPLOAD is "true".
on:
  push:
    branches: [main]
    paths: ["episodes/LATEST"]
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode id(s), space- or comma-separated (folder names in episodes/)"
        required: true

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # episodes/LATEST may list several ids (one per line); each one renders in its own parallel job.
  plan:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - name: List episodes
        id: ids
        env:
          INPUT: ${{ inputs.episode }}
        run: |
          if [ -n "$INPUT" ]; then LIST=$(echo "$INPUT" | tr ', ' '\n\n'); else LIST=$(cat episodes/LATEST); fi
          IDS=$(echo "$LIST" | tr -d '\r' | grep -E '^[a-z0-9-]+$' | jq -R . | jq -sc .)
          echo "$IDS"
          for EP in $(echo "$IDS" | jq -r '.[]'); do test -f "episodes/$EP/upload.json"; done
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        episode: ${{ fromJson(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve episode
        id: ep
        run: |
          EP="${{ matrix.episode }}"
          test -f "episodes/$EP/upload.json"
          echo "id=$EP" >> "$GITHUB_OUTPUT"
          echo "comp=$(jq -r .composition "episodes/$EP/upload.json")" >> "$GITHUB_OUTPUT"
          echo "tag=ep-$(TZ=Asia/Kolkata date +%F)-$EP" >> "$GITHUB_OUTPUT"

      - name: Check YouTube metadata (title, description, tags)
        run: python3 tools/check_upload_meta.py "episodes/${{ steps.ep.outputs.id }}/upload.json"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm ci
          npx remotion browser ensure

      - name: Render
        run: npx remotion render "${{ steps.ep.outputs.comp }}" "out/${{ steps.ep.outputs.id }}.mp4" --codec=h264 --crf=18 --audio-bitrate=192k --gl=swangle

      - name: Verify
        run: |
          F="out/${{ steps.ep.outputs.id }}.mp4"
          ffprobe -v error -show_entries stream=codec_name,width,height:format=duration -of compact "$F"
          ffmpeg -hide_banner -i "$F" -af ebur128 -f null - 2>&1 | grep -A3 Summary | grep "I:"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          EP: ${{ steps.ep.outputs.id }}
          TAG: ${{ steps.ep.outputs.tag }}
        run: |
          TITLE="$(jq -r .title "episodes/$EP/upload.json")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "out/$EP.mp4" "episodes/$EP/upload.json" "episodes/$EP/youtube.md" --clobber
          else
            gh release create "$TAG" "out/$EP.mp4" "episodes/$EP/upload.json" "episodes/$EP/youtube.md" \
              --title "$TITLE" --notes-file "episodes/$EP/youtube.md"
          fi

      - uses: actions/setup-python@v5
        if: ${{ vars.AUTO_UPLOAD == 'true' }}
        with:
          python-version: "3.12"

      - name: Upload to YouTube
        if: ${{ vars.AUTO_UPLOAD == 'true' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          EP: ${{ steps.ep.outputs.id }}
          TAG: ${{ steps.ep.outputs.tag }}
        run: |
          pip install -q google-api-python-client google-auth
          python tools/upload_youtube.py "out/$EP.mp4" "episodes/$EP/upload.json"
          { echo "▶️ YouTube: $(cat youtube_url.txt)"; echo; cat "episodes/$EP/youtube.md"; } > notes.md
          gh release edit "$TAG" --notes-file notes.md
