name: Upload Short to YouTube

# Manual re-upload of an existing release (e.g. an episode published before AUTO_UPLOAD was on).
# Daily uploads happen inside publish.yml.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload (e.g. ep-2026-11-17-nalanda)"
        required: true

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-api-python-client google-auth
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" -D release -p "*.mp4" -p "upload.json"
      - name: Check YouTube metadata (title, description, tags)
        run: python3 tools/check_upload_meta.py release/upload.json
      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          python tools/upload_youtube.py release/*.mp4 release/upload.json
          gh release view "$TAG" --json body --jq .body > old.md
          { echo "▶️ YouTube: $(cat youtube_url.txt)"; echo; cat old.md; } > notes.md
          gh release edit "$TAG" --notes-file notes.md
